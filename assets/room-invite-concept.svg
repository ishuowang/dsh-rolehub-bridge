<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Optional Agent Team Room invitation concept</title>
  <desc id="desc">Synthetic DSH-style Room panel showing the typed RoleHub invitation entry and the separate-session boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f3ff"/><stop offset="1" stop-color="#fafbfe"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d6bfe"/><stop offset="1" stop-color="#745ff4"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7d86a0"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#29355f" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="56" y="64" fill="#1a1f2b" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="760">RoleHub is an optional Room provider</text>
  <text x="56" y="92" fill="#687186" font-family="Inter,Arial,sans-serif" font-size="14">Room stays role-neutral; the bridge verifies and creates a separate child Session before attachment.</text>
  <rect x="910" y="47" width="232" height="24" rx="12" fill="#202737"/>
  <text x="1026" y="63" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="650" text-anchor="middle">CONCEPT PREVIEW · SYNTHETIC DATA</text>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="430" height="468" rx="18" fill="#fff" stroke="#dfe3ed"/>
    <rect x="714" y="132" width="430" height="468" rx="18" fill="#fff" stroke="#dfe3ed"/>
  </g>
  <text x="84" y="174" fill="#171b25" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="730">Review Room</text>
  <text x="84" y="199" fill="#70798b" font-family="Inter,Arial,sans-serif" font-size="12">2 members · open</text>
  <rect x="84" y="226" width="374" height="78" rx="12" fill="#f7f8fb"/>
  <circle cx="108" cy="249" r="7" fill="#4d6bfe"/>
  <text x="128" y="254" fill="#242a36" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650">Leader</text>
  <text x="128" y="279" fill="#7b8496" font-family="Inter,Arial,sans-serif" font-size="11">Current Session · room owner</text>
  <rect x="84" y="316" width="374" height="78" rx="12" fill="#fff" stroke="#e5e8ef"/>
  <circle cx="108" cy="339" r="7" fill="#28a269"/>
  <text x="128" y="344" fill="#242a36" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650">Existing Session</text>
  <text x="128" y="369" fill="#7b8496" font-family="Inter,Arial,sans-serif" font-size="11">dsh.session/v1 · idle</text>
  <rect x="84" y="425" width="374" height="1" fill="#e6e9ef"/>
  <text x="84" y="458" fill="#242a36" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Add a provider-backed member</text>
  <rect x="84" y="478" width="374" height="48" rx="11" fill="#fff" stroke="#4d6bfe"/>
  <circle cx="109" cy="502" r="11" fill="#e9edff"/>
  <path d="M104 502h10M109 497v10" stroke="#4d6bfe" stroke-width="1.8" stroke-linecap="round"/>
  <text x="132" y="507" fill="#3347a8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Choose RoleHub role</text>
  <text x="84" y="557" fill="#80889a" font-family="Inter,Arial,sans-serif" font-size="11">Official typed slot · no DOM patch · no role data stored in Room</text>

  <path d="M506 366H690" stroke="#7d86a0" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
  <rect x="544" y="318" width="108" height="32" rx="16" fill="#fff" stroke="#d9deea"/>
  <text x="598" y="339" fill="#566078" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle">Host command</text>
  <rect x="526" y="383" width="144" height="46" rx="10" fill="#f7f8fb" stroke="#e0e4ec"/>
  <text x="598" y="402" fill="#596174" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" text-anchor="middle">/rolehub start …</text>
  <text x="598" y="418" fill="#596174" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" text-anchor="middle">--room room-id</text>

  <text x="742" y="174" fill="#4d6bfe" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800">VERIFIED ROLE SESSION</text>
  <text x="742" y="204" fill="#171b25" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="730">Careful Reviewer</text>
  <text x="742" y="228" fill="#70798b" font-family="Inter,Arial,sans-serif" font-size="12">Independent continuable child · attached by reference</text>
  <rect x="742" y="255" width="374" height="50" rx="11" fill="#f7f8fb"/>
  <circle cx="766" cy="280" r="9" fill="#dcf6e7"/>
  <path d="m761 280 3 3 6-7" fill="none" stroke="#198754" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="786" y="284" fill="#596174" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10">sha256:b6c92f10a4…a08dd971</text>
  <g font-family="Inter,Arial,sans-serif" font-size="11">
    <rect x="742" y="328" width="111" height="28" rx="14" fill="#eef1ff"/><text x="757" y="346" fill="#3347a8">filesystem.read</text>
    <rect x="861" y="328" width="104" height="28" rx="14" fill="#f0f2f7"/><text x="876" y="346" fill="#596174">room.message</text>
    <rect x="973" y="328" width="91" height="28" rx="14" fill="#fff0f1"/><text x="988" y="346" fill="#a92d39">secrets.use ×</text>
  </g>
  <rect x="742" y="386" width="374" height="104" rx="12" fill="#fbfbfc" stroke="#e3e6ed"/>
  <text x="764" y="414" fill="#242a36" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Isolation boundary</text>
  <text x="764" y="439" fill="#6e778a" font-family="Inter,Arial,sans-serif" font-size="11">Prompt + skills live only in the child Agent scope.</text>
  <text x="764" y="460" fill="#6e778a" font-family="Inter,Arial,sans-serif" font-size="11">Room stores identity provenance, not role contents.</text>
  <rect x="742" y="518" width="374" height="48" rx="11" fill="url(#accent)"/>
  <text x="929" y="547" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Attached to Review Room</text>
</svg>
