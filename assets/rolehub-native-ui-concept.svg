    <rect x="712" y="567" width="86" height="25" rx="12" fill="#fff0f1"/><text x="727" y="584" fill="#a92d39" font-size="11">secrets.use</text>
  </g>
  <rect x="712" y="615" width="596" height="1" fill="#e7e9ef"/>
  <text x="712" y="644" fill="#252a36" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Create a role-scoped Session</text>
  <rect x="712" y="660" width="288" height="38" rx="10" fill="#fff" stroke="#dfe3ea"/>
  <text x="727" y="684" fill="#8b93a3" font-family="Inter,Arial,sans-serif" font-size="12">Careful Reviewer</text>
  <rect x="1012" y="660" width="296" height="38" rx="10" fill="#fff" stroke="#dfe3ea"/>
  <text x="1027" y="684" fill="#596174" font-family="Inter,Arial,sans-serif" font-size="12">Review Room (optional)</text>
