<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RoleHub native UI concept preview</title>
  <desc id="desc">Synthetic DSH-style RoleHub modal showing Hub filters, role search, capabilities, a locked bundle digest, and optional Room attachment.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#8066ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#27345f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <rect x="34" y="34" width="1372" height="832" rx="24" fill="#fff" stroke="#dde2ee"/>
  <rect x="34" y="34" width="224" height="832" rx="24" fill="#f7f8fb"/>
  <rect x="34" y="112" width="224" height="1" fill="#e5e8f0"/>
