  <text x="356" y="480" fill="#1d2433" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">Research Librarian</text>
  <text x="356" y="506" fill="#6e7789" font-family="Inter,Arial,sans-serif" font-size="11">community · v0.8.0 · community</text>
  <rect x="338" y="540" width="312" height="78" rx="12" fill="#fff" stroke="#e5e7ed"/>
  <text x="356" y="568" fill="#1d2433" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">Release Coordinator</text>
  <text x="356" y="594" fill="#6e7789" font-family="Inter,Arial,sans-serif" font-size="11">official · v1.0.1 · reference</text>

