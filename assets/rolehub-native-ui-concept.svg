    <text x="712" y="430" fill="#4d6bfe" font-size="10" font-weight="800">REQUIRED · 1</text>
    <rect x="712" y="441" width="108" height="25" rx="12" fill="#eef1ff"/><text x="726" y="458" fill="#3347a8" font-size="11">filesystem.read</text>
    <text x="712" y="493" fill="#737b8c" font-size="10" font-weight="800">OPTIONAL · 1</text>
    <rect x="712" y="504" width="99" height="25" rx="12" fill="#f0f2f7"/><text x="727" y="521" fill="#596174" font-size="11">room.message</text>
