  <rect x="52" y="790" width="188" height="44" rx="12" fill="#fff" stroke="#dfe3ed"/>
  <circle cx="75" cy="812" r="10" fill="#4d6bfe" opacity=".16"/>
  <path d="M70 812h10M75 807v10" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="817" fill="#262b37" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">RoleHub</text>

