  </g>
  <text x="330" y="127" fill="#171a24" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750">RoleHub</text>
  <text x="330" y="153" fill="#697184" font-family="Inter,Arial,sans-serif" font-size="13">Discover a role, inspect requested access, then create a separate verified Session.</text>
  <rect x="294" y="178" width="1072" height="1" fill="#e8eaf0"/>

  <rect x="324" y="208" width="340" height="580" rx="15" fill="#fbfbfc" stroke="#e1e4eb"/>
